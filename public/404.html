<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Shivaswarajya Techno Innovation</title>
    <meta http-equiv="refresh" content="3;url=/" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #07060a;
        color: #ece8e2;
        font-family: "Inter", system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 700;
        background: linear-gradient(100deg, #f5b945, #cd7f32 55%, #8b5a1c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1.1;
      }
      p { margin-top: 1rem; color: #9c948a; font-size: 1.1rem; }
      a { color: #cd7f32; text-decoration: none; font-weight: 600; }
      a:hover { text-decoration: underline; }
      .timer { margin-top: 0.5rem; font-family: "JetBrains Mono", monospace; font-size: 0.8rem; color: #9c948a80; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist — redirecting you home.</p>
      <p class="timer">Or <a href="/">go now</a> · auto-redirect in 3s</p>
    </main>
    <script>
      // Manual countdown fallback
      let s = 3;
      const el = document.querySelector(".timer");
      const tick = setInterval(() => {
        s--;
        if (el) el.textContent = `Or go now · auto-redirect in ${s}s`;
        if (s <= 0) clearInterval(tick);
      }, 1000);
    </script>
  </body>
</html>
